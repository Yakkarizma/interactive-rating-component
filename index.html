<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Rating Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <div class="rating-hero">
            <div class="icon-star"><img src="img/icon-star.svg" alt=""></div>
            <h1 style="margin-bottom: 5px;">How did we do?</h1>
            <p style="margin-bottom: 15px;">
                Please let us know we did with your support request. 
                All feedback is appreciated to help us improve our offering!
            </p>
            <div class="rating-numbers">
                <button class="rating">1</button>
                <button class="rating">2</button>
                <button class="rating">3</button>
                <button class="rating">4</button>
                <button class="rating">5</button>
            </div>
            <button class="btn" id="submit">SUBMIT</button>
        </div>

        <div class="thank-you-hero">
            <div class="thank-you-img"><img src="img/illustration-thank-you.svg" alt=""></div>
            <div class="rate">You selected <span id="selected-rating">0</span> out of 5</div>
            <h1 style="margin-bottom: 15px;">Thank you!</h1>
            <p>
                We appreciate you taking the time to give a rating. 
                If you ever need more support, don't hesitate to get in touch!
            </p>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
