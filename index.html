<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Rating Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="rating-hero">
            <div class="icon-star"><img src="img/icon-star.svg" alt=""></div>
            <h1 style="margin-bottom: 5px;">How did we do?</h1>
            <p style="margin-bottom: 15px;">
                Please let us know we did with your support request. 
                All feedback is appreciated to help us improve our offering!
            </p>
            <div class="rating-numbers">
                <div class="rating-number"><p>1</p></div>
                <div class="rating-number"><p>2</p></div>
                <div class="rating-number"><p>3</p></div>
                <div class="rating-number"><p>4</p></div>
                <div class="rating-number"><p>5</p></div>
            </div>
            <button class="btn">SUBMIT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
